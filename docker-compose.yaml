version: '3.8'

services:
  # ================================
  # BASE DE DATOS MYSQL (INTERNA)
  # ================================
  db:
    image: mysql:8.0
    container_name: cafe-colombia-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_cafe_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cafe_colombia}
      MYSQL_USER: ${MYSQL_USER:-cafe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cafe_password_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # APLICACIÓN (BACKEND + FRONTEND)
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_PUBLIC_URL=${VITE_PUBLIC_URL:-https://cafecolombia.site}
    container_name: cafe-colombia-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: mysql://${MYSQL_USER:-cafe_user}:${MYSQL_PASSWORD:-cafe_password_2024}@db:3306/${MYSQL_DATABASE:-cafe_colombia}?connect_timeout=30&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:-cafe_secret_key_2024}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-https://cafecolombia.site}
    networks:
      - cafe-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cafe-app.rule=Host(`cafecolombia.site`) || Host(`www.cafecolombia.site`)"
      - "traefik.http.routers.cafe-app.entrypoints=websecure"
      - "traefik.http.routers.cafe-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.cafe-app.loadbalancer.server.port=5001"
      # Redirección HTTP a HTTPS
      - "traefik.http.routers.cafe-app-http.rule=Host(`cafecolombia.site`) || Host(`www.cafecolombia.site`)"
      - "traefik.http.routers.cafe-app-http.entrypoints=web"
      - "traefik.http.routers.cafe-app-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

networks:
  cafe-network:
    driver: bridge

volumes:
  mysql_data: